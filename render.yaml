services:
  - type: web
    name: traffic-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120"
    plan: free
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
